plugins {
    // NOTE the plugin id: the new `net.fabricmc.fabric-loom` coordinate, not the
    // legacy `fabric-loom`. The legacy id resolves to the same version but runs
    // in legacy mode, which demands an explicit `mappings` dependency -- and
    // neither Yarn nor Mojang publish mappings for 26.x any more.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// version and group come straight from gradle.properties.

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    // Deliberately no `mappings` line -- the new Loom plugin needs none.
    // Minecraft names in this project are therefore the Mojang ones:
    // Component, GuiGraphics, Minecraft, ChatFormatting, EditBox, Font.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    // Minecraft 26.1.2 reports javaVersion 25 in the version manifest.
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
