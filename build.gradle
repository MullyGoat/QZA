plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Pure-Java audio decoders, nested in the jar so nothing has to be installed.
    // jlayer decodes mp3; concentus decodes Opus (QZA demuxes the Ogg container itself).
    implementation("com.googlecode.soundlibs:jlayer:${project.jlayer_version}") { transitive = false }
    include("com.googlecode.soundlibs:jlayer:${project.jlayer_version}") { transitive = false }

    implementation("io.github.jaredmdobson:concentus:${project.concentus_version}") { transitive = false }
    include("io.github.jaredmdobson:concentus:${project.concentus_version}") { transitive = false }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    archiveFileName = "${project.archives_base_name}-${project.version}-${project.minecraft_version}.jar"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
