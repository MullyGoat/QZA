name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [ '26.1.2', '26.2', '26.3' ]
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches mod version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          MOD_VERSION=$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$MOD_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match gradle.properties version=$MOD_VERSION. Bump gradle.properties, or retag."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches version $MOD_VERSION"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build for Minecraft ${{ matrix.mc }}
        run: ./gradlew build -Pmc=${{ matrix.mc }} --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: qza-${{ matrix.mc }}
          path: build/libs/*-${{ matrix.mc }}*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: qza-*
          merge-multiple: true
          path: jars

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: jars/*.jar
          generate_release_notes: true
