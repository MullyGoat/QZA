name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Needed so a tagged run can create the Release.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Minecraft 26.1.2 reports javaVersion 25.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --stacktrace

      # Every push gets a downloadable artifact, so you can test a commit
      # without cutting a release.
      - uses: actions/upload-artifact@v7
        with:
          name: qza-dev-build
          path: build/libs/qza-*.jar
          if-no-files-found: error

      # Pushing a tag like v1.0.1 publishes a Release with the jar attached,
      # which is the link you give people to download the mod.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/qza-*.jar
          generate_release_notes: true
